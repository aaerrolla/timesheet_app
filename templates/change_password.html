<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change password - Timesheet</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
<div class="auth-page">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="muted">For security, please choose a new password before continuing.</p>

    <div id="banner" class="banner hidden"></div>

    <form id="changePasswordForm">
      <label>Current password
        <input type="password" id="currentPassword" required autocomplete="current-password">
      </label>
      <label>New password
        <input type="password" id="newPassword" required autocomplete="new-password" minlength="8">
      </label>
      <label>Confirm new password
        <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="8">
      </label>
      <p class="hint-inline">Must be at least 8 characters and different from your current password.</p>
      <button type="submit" class="primary full">Save new password</button>
    </form>

    <button type="button" id="logoutLink" class="link-btn">Log out</button>
  </div>
</div>
<script src="{{ url_for('static', filename='change_password.js') }}"></script>
</body>
</html>
